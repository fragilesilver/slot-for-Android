[package]
name = "slot"
version = "1.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["host"]
host = ["dep:winit", "dep:cpal", "dep:gilrs", "slot-gfx/host"]
device = ["slot-gfx/device"]
android = ["dep:android-activity", "dep:log", "dep:android_logger", "dep:ndk", "dep:jni"]

[dependencies]
slot-gfx = { path = "../slot-gfx", default-features = false }
slot-input = { path = "../slot-input" }
slot-power = { path = "../slot-power" }
slot-retro = { path = "../slot-retro" }
slot-store = { path = "../slot-store" }
slot-ui = { path = "../slot-ui" }
slot-labels = { path = "../slot-labels" }
slot-achievements = { path = "../slot-achievements" }
winit = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
gilrs = { workspace = true, optional = true }
android-activity = { version = "0.6", features = ["native-activity"], optional = true }
ndk = { version = "0.9", features = ["audio"], optional = true }
jni = { version = "0.21", optional = true }
log = { version = "0.4", optional = true }
android_logger = { version = "0.14", optional = true }
libloading = { workspace = true }
libc = { workspace = true }
lz4_flex = { workspace = true }
png = { workspace = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"

[dev-dependencies]
slot-gfx = { path = "../slot-gfx", default-features = false, features = ["test-support"] }
tempfile = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[package.metadata.android]
package = "com.fragilesilver.slot"
build_targets = ["aarch64-linux-android"]
apk_name = "slot-android"
runtime_libs = "android-libs"
resources = "android-res"

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.VIBRATE"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "slot for Android"
icon = "@mipmap/ic_launcher"
has_code = true

[package.metadata.android.application.activity]
name = "com.fragilesilver.slot.SlotActivity"
orientation = "fullSensor"
config_changes = "orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|uiMode|density"

[package.metadata.android.signing.release]
path = "/home/fragkicul/.android/debug.keystore"
keystore_password = "android"
