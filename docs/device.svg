<svg xmlns="http://www.w3.org/2000/svg" class="device-defs" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0"   class="sl"/><stop offset=".3" class="sb"/>
          <stop offset=".7"  class="sb"/><stop offset="1"  class="ss"/>
        </linearGradient>
        <linearGradient id="frameSheen" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0"   stop-color="#fff" stop-opacity=".30"/>
          <stop offset=".12" stop-color="#fff" stop-opacity=".04"/>
          <stop offset=".88" stop-color="#000" stop-opacity=".04"/>
          <stop offset="1"   stop-color="#000" stop-opacity=".30"/>
        </linearGradient>
        <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#16161b"/><stop offset="1" stop-color="#050508"/>
        </linearGradient>
      </defs>

      <!-- A phone on its side: 1100 x 530, the screen window is x40 y40 w1020 h450. -->
      <g id="phoneArt">
        <rect class="btnKey" x="760" y="2"  width="120" height="14" rx="7"/>
        <rect class="btnKey" x="910" y="2"  width="70"  height="14" rx="7"/>
        <rect x="0" y="10" width="1100" height="510" rx="78" fill="url(#frameGrad)"/>
        <rect x="0" y="10" width="1100" height="510" rx="78" fill="url(#frameSheen)"/>
        <rect x="10" y="20" width="1080" height="490" rx="68" fill="#0b0b0f"/>
        <rect x="40" y="40" width="1020" height="450" rx="44" fill="url(#glassGrad)"/>
        <circle cx="66" cy="265" r="11" fill="#000" stroke="#2a2a33" stroke-width="2"/>
      </g>

      <!-- An unfolded book-style foldable: 1000 x 910, the screen window is x30 y40 w940 h840. -->
      <g id="foldArt">
        <rect class="btnKey" x="640" y="2" width="120" height="14" rx="7"/>
        <rect class="btnKey" x="790" y="2" width="70"  height="14" rx="7"/>
        <rect x="0" y="10" width="1000" height="900" rx="56" fill="url(#frameGrad)"/>
        <rect x="0" y="10" width="1000" height="900" rx="56" fill="url(#frameSheen)"/>
        <rect x="10" y="20" width="980" height="880" rx="46" fill="#0b0b0f"/>
        <rect x="30" y="40" width="940" height="840" rx="30" fill="url(#glassGrad)"/>
        <circle cx="900" cy="74" r="10" fill="#000" stroke="#2a2a33" stroke-width="2"/>
      </g>
</svg>
